{% extends "base.html" %}
{% block conteudo %}
<h1>Minha conta</h1>
<section class="cartao" style="max-width:520px">
  <p><strong>{{ usuario.nome }}</strong> · {{ usuario.login }} · {{ usuario.perfil.value }}</p>
  <h3>Trocar senha</h3>
  <form method="post" class="coluna-form"><input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Senha atual <input name="atual" type="password" required autocomplete="current-password"></label>
    <label>Nova senha (mínimo de 8 caracteres) <input name="nova" type="password" required autocomplete="new-password"></label>
    <button>Alterar senha</button>
  </form>
</section>
{% endblock %}
